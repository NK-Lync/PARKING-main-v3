<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XeParking — Quản lý bãi đỗ xe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f3a56'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,sans-serif' font-size='19' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">

  <!-- Chữ và giao diện đều nằm trong repo, không gọi ra Internet.
       Nhờ vậy bản demo chạy được cả khi mạng hỏng. -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/xp.css">
</head>
<body>

  <!-- Màn hình đăng nhập (hiện khi chưa đăng nhập) -->
  <div id="login-root"></div>

  <!-- Khung ứng dụng (ẩn khi chưa đăng nhập) -->
  <div id="app-shell" class="xp-shell" hidden>

    <aside class="xp-side">
      <div class="xp-side-brand">
        <span class="xp-side-mark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <path d="M9.5 17V7.5h3.2a3.3 3.3 0 0 1 0 6.6H9.5"/>
          </svg>
        </span>
        <div>
          <div class="xp-side-name">XeParking</div>
          <div class="xp-side-sub">Bãi đỗ xe</div>
        </div>
      </div>

      <nav id="sidebar-nav" class="xp-nav"></nav>

      <div class="xp-side-foot" id="side-user"></div>
    </aside>

    <div class="xp-main">
      <header class="xp-top">
        <button class="xp-btn xp-btn-outline xp-btn-sm xp-btn-icon xp-burger"
                id="btn-toggle-sidebar" aria-label="Mở menu">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M3 6h18M3 12h18M3 18h18"/>
          </svg>
        </button>

        <h1 id="topbar-title" class="xp-top-title"></h1>

        <div class="xp-top-right">
          <div id="topbar-user" class="xp-row"></div>
          <button class="xp-btn xp-btn-outline xp-btn-sm" id="btn-logout">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
            </svg>
            <span class="xp-hide-nho">Đăng xuất</span>
          </button>
        </div>
      </header>

      <main id="app-content" class="xp-content"></main>
    </div>
  </div>

  <!-- Nền mờ khi sidebar mở trên màn hẹp -->
  <div id="side-scrim" class="xp-scrim" hidden></div>

  <!-- Vùng chứa thông báo nổi và hộp thoại -->
  <div id="toast-root" class="xp-toasts"></div>
  <div id="modal-root"></div>

  <!-- Thư viện vẽ biểu đồ, bản UMD nhúng sẵn -->
  <script src="vendor/chart.umd.min.js"></script>

  <!-- Lõi -->
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/md.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/router.js"></script>
  <script src="js/camera.js"></script>

  <!-- Màn hình -->
  <script src="js/views/login.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/taikhoan.js"></script>
  <script src="js/views/khuvuc.js"></script>
  <script src="js/views/loaixe.js"></script>
  <script src="js/views/vitrido.js"></script>
  <script src="js/views/entry.js"></script>
  <script src="js/views/exit.js"></script>
  <script src="js/views/vethang.js"></script>
  <script src="js/views/lichsu.js"></script>
  <script src="js/views/chotrong.js"></script>
  <script src="js/views/thongke.js"></script>
  <script src="js/views/ai.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => App.router.init());
  </script>
</body>
</html>
