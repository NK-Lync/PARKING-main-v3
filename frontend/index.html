<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống quản lý bãi đỗ xe AI</title>

  <!-- Bootstrap 5 + Icons + Chart.js -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <!-- Màn hình đăng nhập (hiện khi chưa đăng nhập) -->
  <div id="login-root"></div>

  <!-- Khung ứng dụng (ẩn khi chưa đăng nhập) -->
  <div id="app-shell" style="display:none">
    <div class="sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-p-square-fill me-2"></i>
        <span class="fw-semibold">Xe Parking</span>
      </div>
      <div id="sidebar-nav" class="sidebar-nav"></div>
    </div>

    <div class="main">
      <div class="topbar">
        <button class="btn btn-light d-md-none" id="btn-toggle-sidebar">
          <i class="bi bi-list"></i>
        </button>
        <h1 id="topbar-title" class="topbar-title"></h1>
        <div class="ms-auto d-flex align-items-center gap-2">
          <div id="topbar-user"></div>
          <button class="btn btn-outline-secondary btn-sm" id="btn-logout">
            <i class="bi bi-box-arrow-right"></i> Đăng xuất
          </button>
        </div>
      </div>
      <div id="app-content" class="content"></div>
    </div>
  </div>

  <!-- Vùng chứa toast & modal -->
  <div id="toast-root" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Core -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/router.js"></script>

  <!-- Views -->
  <script src="js/views/login.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/taikhoan.js"></script>
  <script src="js/views/khuvuc.js"></script>
  <script src="js/views/loaixe.js"></script>
  <script src="js/views/vitrido.js"></script>
  <script src="js/views/entry.js"></script>
  <script src="js/views/exit.js"></script>
  <script src="js/views/vethang.js"></script>
  <script src="js/views/lichsu.js"></script>
  <script src="js/views/chotrong.js"></script>
  <script src="js/views/thongke.js"></script>
  <script src="js/views/ai.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => App.router.init());
  </script>
</body>
</html>
